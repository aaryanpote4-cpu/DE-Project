<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery & Logistics Optimizer - Enterprise Platform</title>
    <!-- Leaflet & MarkerCluster CSS for Map integration -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    <style>
      /* Fallback styles before React bundle loads */
      body {
        margin: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .preloader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #334155;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .preloader-title {
        font-size: 20px;
        font-weight: 700;
        color: #38bdf8;
        margin-bottom: 8px;
      }
      .preloader-sub {
        font-size: 14px;
        color: #94a3b8;
        max-width: 480px;
        line-height: 1.5;
      }
      .preloader-tip {
        margin-top: 24px;
        font-size: 13px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 18px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="preloader-spinner"></div>
        <div class="preloader-title">Loading Logistics Platform...</div>
        <div class="preloader-sub">Initializing geospatial routing engine, Indian warehouse network, and live inventory state.</div>
        <div class="preloader-tip">
          💡 <strong>Tip:</strong> If this screen persists, ensure the dev server is active by running <code>npm run dev</code> inside <code>frontend</code> or running <code>start.bat</code> in the project root.
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171;">
        JavaScript is required to run the Delivery & Logistics Optimizer. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
